name: matrix_strategy_CI_CD_pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: eclipse-temurin:17
    strategy:
      matrix:
        java-version: [11,17,21]
  steps:
      -name: checkout
       uses: actions/checkout@app.java
      -name: setup JAVA
       uses: actions/setup-java@app.java
       with:
         java-version: ${{matrix.java-version}}
      -name: check JAVA version
       run: java -version
      -name: build with maven
       run: mvn clean compile

        
        
          




